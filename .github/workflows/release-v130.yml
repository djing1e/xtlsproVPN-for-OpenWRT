name: Prepare or publish v1.3.0 administration recovery release
on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/release-v130.yml'
      - 'scripts/publish-v130.sh'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish stable release after final HOME package and reboot verification
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: publish-v130
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify package source matches tested r4 build
        run: git diff --exit-code f5c77c5d39e06968ba88c259bc8111713dc1716b HEAD -- package/xtlsprovpn
      - name: Verify exact APK and prepare draft or publish
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish }}
        run: bash scripts/publish-v130.sh
