name: Sync v1.0.0 release description
on:
  push:
    branches: ['main']
    paths:
      - 'docs/releases/v1.0.0.md'
      - '.github/workflows/release-notes.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync-v1-release-notes
  cancel-in-progress: false
jobs:
  update-description:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update description of the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v1.0.0 >/dev/null
          gh release edit v1.0.0 --notes-file docs/releases/v1.0.0.md
          gh release view v1.0.0 --json body --jq .body > /tmp/release-body.md
          python3 - <<'PY'
          from pathlib import Path
          assert Path('/tmp/release-body.md').read_text().rstrip() == Path('docs/releases/v1.0.0.md').read_text().rstrip()
          PY
