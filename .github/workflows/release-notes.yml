name: Sync release descriptions
on:
  push:
    branches: ['main']
    paths:
      - 'install.sh'
      - 'update.sh'
      - 'tests/test_install_links.py'
      - 'docs/releases/**'
      - '.github/workflows/release-notes.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync-v1-release-notes
  cancel-in-progress: false
jobs:
  update-description:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check install and update entry points
        run: |
          sh -n install.sh
          sh -n update.sh
          python3 -m unittest discover -s tests -p 'test_install_links.py'
      - name: Update descriptions of published releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for tag in v1.0.0 v1.1.0 v1.1.1; do
            gh release view "$tag" >/dev/null
            gh release edit "$tag" --notes-file "docs/releases/$tag.md"
            gh release view "$tag" --json body --jq .body > /tmp/release-body.md
            python3 - "$tag" <<'PY'
          from pathlib import Path
          import sys
          assert Path('/tmp/release-body.md').read_text().rstrip() == Path('docs/releases/'+sys.argv[1]+'.md').read_text().rstrip()
          PY
          done
