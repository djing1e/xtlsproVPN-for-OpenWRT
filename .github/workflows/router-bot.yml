name: Router bot SSH bridge checks
on:
  push:
    branches: ['feature/router-bot', 'feature/easy-router-enrollment', 'feature/bot-operator-menu', 'feature/router-catalog', 'release/v1.4.1', 'main']
    paths:
      - 'integrations/router-bot/**'
      - '.github/workflows/router-bot.yml'
  pull_request:
    paths:
      - 'integrations/router-bot/**'
      - 'package/xtlsprovpn/files/usr/share/xray/lab/**'
      - 'tests/test_installed_version.py'
      - '.github/workflows/router-bot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ucode-lang/ucode
          ref: 85922056ef7abeace3cca3ab28bc1ac2d88e31b1
          path: .host-src/ucode
      - name: Build pinned host ucode for controller tests
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libjson-c-dev gnupg
          cmake -S .host-src/ucode -B .host-build/ucode \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/ucode" -DCMAKE_INSTALL_LIBDIR=lib \
            -DUCI_SUPPORT=OFF -DUBUS_SUPPORT=OFF -DULOOP_SUPPORT=OFF \
            -DRTNL_SUPPORT=OFF -DNL80211_SUPPORT=OFF -DDIGEST_SUPPORT=OFF -DZLIB_SUPPORT=OFF
          cmake --build .host-build/ucode -j2
          cmake --install .host-build/ucode
          mkdir -p "$RUNNER_TEMP/xtls-tools"
          cat > "$RUNNER_TEMP/xtls-tools/ucode" <<'SH'
          #!/bin/sh
          export LD_LIBRARY_PATH="$RUNNER_TEMP/ucode/lib"
          exec "$RUNNER_TEMP/ucode/bin/ucode" -L "$RUNNER_TEMP/ucode/lib/ucode" "$@"
          SH
          chmod +x "$RUNNER_TEMP/xtls-tools/ucode"
          echo "$RUNNER_TEMP/xtls-tools" >> "$GITHUB_PATH"
      - name: Check SSH command boundary and installer
        run: python3 -m unittest discover -s integrations/router-bot/tests
      - name: Check installed package version and updater
        run: |
          python3 -m unittest discover -s tests -p 'test_subscription_transport.py'
          python3 -m unittest discover -s tests -p 'test_subscription_tls_hotfix.py'
          python3 -m unittest discover -s tests -p 'test_sync_transaction.py'
          python3 -m unittest discover -s tests -p 'test_installed_version.py'
          python3 -m unittest discover -s tests -p 'test_package_update.py'
          python3 scripts/check-source.py
