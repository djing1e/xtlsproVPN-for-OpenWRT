name: xtlsproVPN ARM64 package (development)
on:
  workflow_dispatch:
  push:
    branches: ['main', 'fix/safe-subscription-apply', 'feature/netbird-admin', 'feature/package-ui', 'feature/low-memory-sync', 'feature/router-admin-updates', 'feature/netbird-recovery', 'feature/router-bot', 'feature/wrapper-guard', 'release/v1.4.2', 'fix/source-interface-auto']
    tags: ['v1.0.0*']
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/release-notes.yml'
permissions:
  contents: read
jobs:
  netbird-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ucode-lang/ucode
          ref: 85922056ef7abeace3cca3ab28bc1ac2d88e31b1
          path: .host-src/ucode
      - name: Build pinned host ucode for controller tests
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libjson-c-dev gnupg
          cmake -S .host-src/ucode -B .host-build/ucode \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/ucode" -DCMAKE_INSTALL_LIBDIR=lib \
            -DUCI_SUPPORT=OFF -DUBUS_SUPPORT=OFF -DULOOP_SUPPORT=OFF \
            -DRTNL_SUPPORT=OFF -DNL80211_SUPPORT=OFF -DDIGEST_SUPPORT=OFF -DZLIB_SUPPORT=OFF
          cmake --build .host-build/ucode -j2
          cmake --install .host-build/ucode
          mkdir -p "$RUNNER_TEMP/xtls-tools"
          cat > "$RUNNER_TEMP/xtls-tools/ucode" <<'SH'
          #!/bin/sh
          export LD_LIBRARY_PATH="$RUNNER_TEMP/ucode/lib"
          exec "$RUNNER_TEMP/ucode/bin/ucode" -L "$RUNNER_TEMP/ucode/lib/ucode" "$@"
          SH
          chmod +x "$RUNNER_TEMP/xtls-tools/ucode"
          echo "$RUNNER_TEMP/xtls-tools" >> "$GITHUB_PATH"
      - name: Check fleet onboarding and bot operations
        run: python3 -m unittest discover -s integrations/router-bot/tests
      - name: Check NetBird control, jobs and UI
        run: |
          python3 scripts/check-source.py
          python3 -m unittest discover -s tests -p 'test_netbird.py'
          python3 -m unittest discover -s tests -p 'test_netbird_guard.py'
          python3 -m unittest discover -s tests -p 'test_wrapper_guard_adopt.py'
          python3 -m unittest discover -s tests -p 'test_rescue.py'
          node tests/test_rescue_ui.js
          python3 -m unittest discover -s tests -p 'test_install_links.py'
          python3 -m unittest discover -s tests -p 'test_release_v142.py'
          python3 -m unittest discover -s tests -p 'test_source_interfaces.py'
          python3 -m unittest discover -s tests -p 'test_dns_probe.py'
          python3 -m unittest discover -s tests -p 'test_sync_plan.py'
          python3 -m unittest discover -s tests -p 'test_sync_probe.py'
          python3 -m unittest discover -s tests -p 'test_subscription_private.py'
          python3 -m unittest discover -s tests -p 'test_select_live.py'
          python3 -m unittest discover -s tests -p 'test_selection_events.py'
          python3 -m unittest discover -s tests -p 'test_live_feature.py'
          node tests/test_subscription_ui.js
          node tests/test_netbird_ui.js
          node tests/test_dashboard_jobs.js
          python3 -m unittest discover -s tests -p 'test_package_update.py'
          node tests/test_package_update_ui.js
  build:
    needs: netbird-checks
    # Release promotion and external installer-only changes reuse the tested APK.
    if: github.event_name != 'push' || (!startsWith(github.event.head_commit.message, 'Release v') && !startsWith(github.event.head_commit.message, 'installer:'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install SDK host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd
      - name: Check source tree
        run: python3 scripts/check-source.py
      - name: Check subscription recovery and network cleanup
        run: |
          python3 -m unittest discover -s tests -p 'test_recovery_journal.py'
          python3 -m unittest discover -s tests -p 'test_sync_transaction.py'
          python3 -m unittest discover -s tests -p 'test_redirects.py'
          python3 -m unittest discover -s tests -p 'test_stop_safety.py'
          python3 -m unittest discover -s tests -p 'test_local_policy.py'
          python3 -m unittest discover -s tests -p 'test_service_config_watch.py'
          python3 -m unittest discover -s tests -p 'test_executable_modes.py'
      - name: Build APK with official OpenWrt SDK
        run: |
          bash scripts/build-sdk.sh
          python3 scripts/make-update-manifest.py dist/xtlsprovpn-1.4.2-r1.apk --output dist/update.json
          python3 scripts/package-router-bot.py --output dist/xtls-router-bot-1.4.2.tar.gz
          (cd dist && sha256sum ./xtlsprovpn-1.4.2-r1.apk ./xtls-router-bot-1.4.2.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: xtlsprovpn-1.4.2-openwrt-25.12.5-arm64
          path: dist/*
          if-no-files-found: error

  publish-v142:
    needs: [netbird-checks, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: publish-v142
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: xtlsprovpn-1.4.2-openwrt-25.12.5-arm64
          path: dist
      - name: Verify source-bound artifacts and publish v1.4.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-v142.sh
